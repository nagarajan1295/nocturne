# BirdThing Bluetooth PAN settings (sourced by /opt/birdthing/bt-pan.sh).
#
# The Car Thing is the PAN *client* (PANU). The Raspberry Pi runs the NAP
# server (its /opt/birdthing/bt-nap.sh) and is the gateway 192.168.44.1.

# Bluetooth MAC of the Pi's NAP adapter.
PI_BT_MAC=DC:A6:32:62:53:01

# Static address the Car Thing gives its bnep0 interface (Pi NAP bridge is
# 192.168.44.1/24; dnsmasq hands out .10-.50, so .2 never collides).
CT_BT_IP=192.168.44.2/24
