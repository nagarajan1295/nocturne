; BirdThing services (Car Thing side). Picked up via supervisord.conf:
;   [include] files = /etc/supervisor.d/*.conf

[program:bt-pan]
; Maintain the Bluetooth PAN link to the Pi NAP (bnep0 = 192.168.44.2).
command=/bin/sh /opt/birdthing/bt-pan.sh
numprocs=1
autostart=true
autorestart=true
startsecs=2
priority=78
redirect_stderr=true
stdout_logfile=/var/log/bt-pan.log
stdout_logfile_maxbytes=512KB
stdout_logfile_backups=1

[program:birdmic]
command=/usr/bin/python3 /opt/birdthing/birdmic_ct.py
numprocs=1
autostart=true
autorestart=true
startsecs=2
priority=80
redirect_stderr=true
stdout_logfile=/var/log/birdmic.log
stdout_logfile_maxbytes=512KB
stdout_logfile_backups=1

[program:birdknob]
command=/usr/bin/python3 /opt/birdthing/birdknob_ct.py
numprocs=1
autostart=true
autorestart=true
startsecs=2
priority=85
redirect_stderr=true
stdout_logfile=/var/log/birdknob.log
stdout_logfile_maxbytes=512KB
stdout_logfile_backups=1
