; BirdThing services (Car Thing side). Picked up via supervisord.conf:
;   [include] files = /etc/supervisor.d/*.conf

[program:bt-pan]
; Maintain the Bluetooth PAN link to the Pi NAP (bnep0 = 192.168.44.2).
command=/bin/sh /opt/birdthing/bt-pan.sh
numprocs=1
autostart=true
autorestart=true
startsecs=2
priority=78
redirect_stderr=true
stdout_logfile=/var/log/bt-pan.log
stdout_logfile_maxbytes=512KB
stdout_logfile_backups=1

[program:birdmic]
; OTA: fetch the latest birdmic_ct.py from the Pi at boot, fall back to baked.
command=/bin/sh /opt/birdthing/agent-run.sh birdmic_ct.py
numprocs=1
autostart=true
autorestart=true
startsecs=2
priority=80
redirect_stderr=true
stdout_logfile=/var/log/birdmic.log
stdout_logfile_maxbytes=512KB
stdout_logfile_backups=1

[program:birdknob]
; OTA: fetch the latest birdknob_ct.py from the Pi at boot, fall back to baked.
command=/bin/sh /opt/birdthing/agent-run.sh birdknob_ct.py
numprocs=1
autostart=true
autorestart=true
startsecs=2
priority=85
redirect_stderr=true
stdout_logfile=/var/log/birdknob.log
stdout_logfile_maxbytes=512KB
stdout_logfile_backups=1

[program:backlight]
; Backlight + display-blank daemon (aml-bl panel; reads /tmp/bt_bright and
; /tmp/display_off written by birdknob's control server / the dashboard).
command=/bin/sh /opt/birdthing/agent-run.sh setup_backlight.sh
numprocs=1
autostart=true
autorestart=true
startsecs=2
priority=84
redirect_stderr=true
stdout_logfile=/var/log/backlight.log
stdout_logfile_maxbytes=256KB
stdout_logfile_backups=1
